<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px;
        margin: 0;
        padding: 14px 16px;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1c1f2e;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 10px 0;
        gap: 10px;
      }
      label {
        font-weight: 500;
      }
      select {
        max-width: 140px;
      }
      input[type="range"] {
        width: 110px;
      }
      .hint {
        margin-top: 12px;
        font-size: 11px;
        color: #6b7086;
      }
      .switch {
        position: relative;
        width: 36px;
        height: 20px;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        inset: 0;
        cursor: pointer;
        background: #c4c9dd;
        border-radius: 999px;
        transition: background 0.15s;
      }
      .slider::before {
        content: "";
        position: absolute;
        height: 16px;
        width: 16px;
        left: 2px;
        top: 2px;
        background: #fff;
        border-radius: 50%;
        transition: transform 0.15s;
      }
      input:checked + .slider {
        background: #6c8cff;
      }
      input:checked + .slider::before {
        transform: translateX(16px);
      }
      button {
        padding: 4px 10px;
        border: 1px solid #c4c9dd;
        border-radius: 6px;
        background: #fff;
        font: inherit;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: #eef1fb;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <h1>Kokoro Reader</h1>
    <div class="row">
      <label for="enabled">Enabled</label>
      <span class="switch">
        <input type="checkbox" id="enabled" />
        <span class="slider"></span>
      </span>
    </div>
    <div class="row">
      <label>Playback</label>
      <span>
        <button id="pause" disabled>⏸ Pause</button>
        <button id="stop" disabled>⏹ Stop</button>
      </span>
    </div>
    <div class="row">
      <label for="voice">Voice</label>
      <select id="voice"></select>
    </div>
    <div class="row">
      <label for="speed">Speed</label>
      <span><input type="range" id="speed" min="0.5" max="2" step="0.1" /> <span id="speedVal"></span></span>
    </div>
    <div class="hint">
      First use downloads the Kokoro model, then everything runs locally.
      Select text, click ▶ Read. Click the status chip to pause/resume;
      press Esc to stop.
    </div>
    <script src="popup.js"></script>
  </body>
</html>
